version: '3.8'
services:
  qwen_app:
    build: .
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - HF_HOME=/workspace/hf_cache
      - PYTHONUNBUFFERED=1
    ports: ["7860:7860"]
    volumes: ["/workspace/hf_cache:/workspace/hf_cache"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]